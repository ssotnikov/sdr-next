name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  build:
    strategy:
      matrix:
        target:
          - windows/amd64
          - windows/arm64
          - linux/amd64
          - linux/arm64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.target }}
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go vet ./...
          go build -trimpath -o /dev/null ./cmd/sdrnext
        env:
          TARGET: ${{ matrix.target }}
